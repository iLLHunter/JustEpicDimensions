// Task actions must not touch Task.project at execution time (an error from Gradle 10 and with the configuration cache):
// resolve paths while configuring and copy through the injected file-system service.
interface StagingFileOperations { @javax.inject.Inject FileSystemOperations getFs() }
def stagingFiles = objects.newInstance(StagingFileOperations)
def workspaceRoot = projectDir.canonicalFile.toPath()
def stagingRuns = file("validation/runs/${scenario}")
def packagedJar = tasks.named('jar')
tasks.register('stageCoremod', Copy) {
    onlyIf { !nativeControl }
    dependsOn coremodJar
    doFirst {
        ['server',providers.gradleProperty('clientDir').getOrElse('client')].unique().each { role ->
            def previous=new File(stagingRuns,"${role}/mods/justepicdimensions-light-coremod.jar")
            if(previous.exists()) {
                def retired=new File(stagingRuns,"${role}/retired-mods/justepicdimensions-light-coremod.jar")
                if(!previous.canonicalFile.toPath().startsWith(workspaceRoot) || !retired.canonicalFile.toPath().startsWith(workspaceRoot)) throw new GradleException('Coremod retirement outside workspace')
                retired.parentFile.mkdirs()
                java.nio.file.Files.move(previous.toPath(),retired.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
    from coremodJar
    into "validation/runs/${scenario}/${providers.gradleProperty('clientDir').getOrElse('client')}/mods"
    doLast { stagingFiles.fs.copy { from coremodJar; into new File(stagingRuns,'server/mods') } }
}
tasks.register('stagePackagedJed', Copy) {
    onlyIf { packagedJed }
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into "validation/runs/${scenario}/${providers.gradleProperty('clientDir').getOrElse('client')}/mods"
    doLast { stagingFiles.fs.copy { from packagedJar; into new File(stagingRuns,'server/mods') } }
}
neoForge {
    version = '21.1.243'
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    mods {
        if (nativeControl) {
            clear()
            jed_native_validation { sourceSet sourceSets.nativeControl }
        }
        else {
            if (!packagedJed) { justepicdimensions { sourceSet sourceSets.main } }
            jed_light_validation { sourceSet sourceSets.validation }
            if (pairControl) { jed_native_validation { sourceSet sourceSets.nativeControl } }
        }
    }
    runs {
        validationClient {
            client()
            if (packagedJed) {
                sourceSet = sourceSets.validation
                loadedMods.set([neoForge.mods.jed_light_validation])
            }
            if (nativeControl) {
                sourceSet = sourceSets.nativeControl
                loadedMods.set([neoForge.mods.jed_native_validation])
            }
            gameDirectory = file("validation/runs/${scenario}/${providers.gradleProperty('clientDir').getOrElse('client')}")
            systemProperty 'jed.scenario', scenario
            systemProperty 'jed.resultDir', resultDir.absolutePath
            systemProperty 'jed.suite', providers.gradleProperty('suite').getOrElse('core')
            systemProperty 'jed.multi', providers.gradleProperty('multi').getOrElse('false')
            systemProperty 'jed.runtime.packaged', packagedJed.toString()
            systemProperty 'jed.runtime.expectedJar', file("validation/runs/${scenario}/${providers.gradleProperty('clientDir').getOrElse('client')}/mods/${packagedJarFileName}").absolutePath
            systemProperty 'jed.structure.trace', providers.gradleProperty('structureTrace').getOrElse('false')
            systemProperty 'jed.structure.profile', providers.gradleProperty('structureProfile').getOrElse('false')
            systemProperty 'jed.structure.delay', providers.gradleProperty('structureDelay').getOrElse('0')
            systemProperty 'jed.spawnchunks.profile.fixtureGate', providers.gradleProperty('spawnChunksFixtureGate').getOrElse('false')
            systemProperty 'jed.diagnostic.pair', pairControl.toString()
            systemProperty 'jed.diagnostic.expectJed', (!nativeControl).toString()
            systemProperty 'jed.diagnostic.cycles', providers.gradleProperty('cycles').getOrElse('1')
            systemProperty 'jed.whole.settleTicks', providers.gradleProperty('settleTicks').getOrElse('400')
            systemProperty 'jed.diagnostic.fix', providers.gradleProperty('probeFix').getOrElse('off')
            systemProperty 'jed.diagnostic.stopMode', providers.gradleProperty('stopMode').getOrElse('both')
            systemProperty 'jed.diagnostic.verifyPersistence', providers.gradleProperty('verifyPersistence').getOrElse('false')
            jvmArgument '-Xmx3G'
            programArguments.addAll('--username', providers.gradleProperty('clientName').getOrElse('JEDLightTest'), '--width', '960', '--height', '540')
        }
        validationServer {
            server()
            if (packagedJed) {
                sourceSet = sourceSets.validation
                loadedMods.set([neoForge.mods.jed_light_validation])
            }
            gameDirectory = file("validation/runs/${scenario}/server")
            systemProperty 'jed.scenario', scenario
            systemProperty 'jed.resultDir', resultDir.absolutePath
            systemProperty 'jed.suite', providers.gradleProperty('suite').getOrElse('core')
            systemProperty 'jed.multi', providers.gradleProperty('multi').getOrElse('false')
            systemProperty 'jed.runtime.packaged', packagedJed.toString()
            systemProperty 'jed.runtime.expectedJar', file("validation/runs/${scenario}/server/mods/${packagedJarFileName}").absolutePath
            systemProperty 'jed.structure.trace', providers.gradleProperty('structureTrace').getOrElse('false')
            systemProperty 'jed.structure.profile', providers.gradleProperty('structureProfile').getOrElse('false')
            systemProperty 'jed.structure.delay', providers.gradleProperty('structureDelay').getOrElse('0')
            systemProperty 'jed.spawnchunks.profile.fixtureGate', providers.gradleProperty('spawnChunksFixtureGate').getOrElse('false')
            systemProperty 'jed.whole.settleTicks', providers.gradleProperty('settleTicks').getOrElse('400')
            jvmArgument '-Xmx3G'
            programArgument '--nogui'
        }
    }
}
