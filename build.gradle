tasks.named('jar') {
    from('LICENSE')
    from('legal/GPL-3.0.txt') { into 'docs/legal' }
    // Players install one file: NeoForge's Jar-in-Jar loads the nested Arbitrage mod, and its own nested transformer
    // library, from inside this JAR before any game code. META-INF/jarjar/metadata.json declares it.
    from(coremodJar) { into 'META-INF/jarjar'; rename { 'arbitrage.jar' } }
    manifest.attributes('Implementation-Title': 'Just Epic Dimensions', 'Implementation-Version': project.version)
}

