// Third-party test mods come from mc-testkit's shared fixture store, never from this repository (testkit.toml
// [fixtures]). A suite passes each as TESTKIT_FIXTURE_<KEY>; outside one, validation/testfixtures.py resolves the same
// path through the toolkit checkout.
def fixturePaths = [:]
def testFixture = { String key ->
    fixturePaths.computeIfAbsent(key) {
        def value = System.getenv("TESTKIT_FIXTURE_${key}")
        if (!value) {
            value = providers.exec { commandLine 'python3', file('validation/testfixtures.py').path, key }
                .standardOutput.asText.get().trim()
        }
        file(value)
    }
}
def fixtureJars = { String key, List<String> excludes = [] ->
    fileTree(dir: testFixture(key), include: '*.jar', excludes: excludes).files.collect { it.absolutePath }.sort()
}
// Sodium's mod classes are a Jar-in-Jar entry of the pinned Sodium download; contracts read the extracted entry.
def sodiumModJar = tasks.register('sodiumModJar', Copy) {
    from(zipTree(testFixture('SODIUM'))) {
        include 'META-INF/jarjar/*-mod.jar'
        eachFile { path = 'sodium-mod.jar' }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('fixtures/sodium')
}
